# ----------------------------------------------------------------------
# slam_toolbox.yaml — SLAM Toolbox 在线异步建图参数
# ----------------------------------------------------------------------
# 基线：/opt/ros/humble/share/slam_toolbox/config/mapper_params_online_async.yaml
# 适配点（相对基线）：
#   1. max_laser_range 20.0 → 8.0   （本机器人激光量程上限 8.0 m）
#   2. min_laser_range 0.0 → 0.13   （过滤 <0.13 m 读数：车体自遮挡瞬态出现在
#                                     0.12 m = range_min 盲区，避免其进入地图）
#   3. map_update_interval 5.0 → 2.0（建图演示更新更及时）
#   4. enable_interactive_mode → false（自动化建图不需要交互校正）
#   5. 追加 use_sim_time: true（仿真时钟）
# 帧约定：map_frame=map（SLAM 发布 map→odom，与 AMCL/Cartographer 互斥）、
#         odom_frame=odom、base_frame=base_footprint（与差速驱动插件一致）
# 全部参数显式列出并注释（规格第 19 条：参数集中管理）。
slam_toolbox:
  ros__parameters:

    # ---------- 求解器（Ceres，保持官方默认） ----------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ---------- ROS 接口 ----------
    odom_frame: odom            # 里程计帧（与差速驱动插件一致）
    map_frame: map              # 地图帧（map→odom 由此节点发布）
    base_frame: base_footprint  # 机器人基座帧（与插件 robot_base_frame 一致）
    scan_topic: /scan           # 激光输入
    use_map_saver: true         # 开启 /map 发布（供 map_saver_cli 保存）
    mode: mapping               # 建图模式（localization 留待后续）
    # 恢复既有地图（与 localization 配合）：
    # map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    # map_start_at_dock: true

    # ---------- 基础行为 ----------
    debug_logging: false
    throttle_scans: 1           # 每 N 帧扫描处理 1 帧（1=全处理）
    transform_publish_period: 0.02  # map→odom 发布周期 50 Hz
    map_update_interval: 2.0    # 地图更新间隔（s），越小更新越频繁
    resolution: 0.05            # 栅格分辨率 5 cm/格
    min_laser_range: 0.13       # 过滤 <0.13 m 读数（车体自遮挡瞬态在 0.12 m）
    max_laser_range: 8.0        # 与本机激光量程一致（基线为 20.0）
    minimum_time_interval: 0.5  # 两次扫描插入的最小时间间隔
    transform_timeout: 0.2      # TF 查询超时
    tf_buffer_duration: 30.0    # TF 缓冲时长
    stack_size_to_use: 40000000 # 大地图序列化所需栈大小
    enable_interactive_mode: false  # 自动化建图无需交互校正（基线为 true）

    # ---------- 扫描匹配与插入 ----------
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.5    # 位移 >0.5 m 才插入新关键帧
    minimum_travel_heading: 0.5     # 转角 >0.5 rad 才插入新关键帧
    scan_buffer_size: 10            # 扫描缓冲（滑动窗口）
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0

    # ---------- 回环检测（本路线含 16 m 走廊与回环，必须开启） ----------
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---------- 相关搜索（帧间匹配） ----------
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # ---------- 相关搜索（回环） ----------
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ---------- 扫描匹配器惩罚项 ----------
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1

    # ---------- 仿真时钟 ----------
    use_sim_time: true
